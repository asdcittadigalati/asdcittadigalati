[build]
  command = "npm run build"
  publish = "dist"

# package.json richiede Node >= 22.12. Netlify usa una versione predefinita
# che puo' essere piu' vecchia: senza questa riga il primo build automatico
# fallisce, e la causa non e' evidente dal messaggio d'errore.
[build.environment]
  NODE_VERSION = "22"

# Header e redirect stanno in public/_headers e public/_redirects: stesso
# formato per Netlify e Cloudflare Pages.
