# Accesso con account GitHub. Netlify Identity e Git Gateway sono deprecati
# (Netlify non ne corregge piu' i bug e ne sconsiglia l'uso sui siti nuovi),
# quindi il pannello parla direttamente con GitHub: chi gestisce i contenuti
# entra col proprio account GitHub e deve essere invitato come collaboratore
# del repository.
backend:
  name: github
  # Repo sull'account GitHub della squadra (dal 01/10/2026).
  repo: asdcittadigalati/asdcittadigalati
  branch: main
  # L'accesso passa da /auth e /callback sul sito stesso (worker/index.mjs su
  # Cloudflare): servono perche' lo scambio finale con GitHub richiede un segreto
  # che non puo' stare in una pagina web. Nessun servizio esterno in piu'.
  # Il callback dell'applicazione OAuth su GitHub deve essere lo stesso dominio.
  base_url: https://asdcittadigalati.it

# Backend locale per le prove in sviluppo: decommentare e lanciare
# `npx @sveltia/cms-proxy-server` per scrivere sul disco senza passare da
# GitHub. Deve restare commentato in produzione.
# local_backend: true

media_folder: "public/img/uploads"
public_folder: "/img/uploads"

locale: "it"

collections:
  - name: "social"
    label: "Social"
    label_singular: "Post"
    description: "Incolla il link di un post pubblico di Instagram, Facebook o TikTok: sul sito compare da solo, in home e nella pagina Social."
    folder: "src/content/social"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{hour}}{{minute}}{{second}}"
    identifier_field: "link"
    summary: "{{date | date('DD/MM/YYYY')}} · {{link}}"
    sortable_fields: ["date"]
    format: "frontmatter"
    fields:
      - label: "Link al post"
        name: "link"
        widget: "string"
        required: true
        hint: "Dal social: tocca Condividi (o i tre puntini) e poi Copia link, e incollalo qui. Il post deve essere pubblico: i profili privati e i post dentro i gruppi Facebook non si vedono. Facebook dal telefono: se sul sito il post compare solo come 'Apri il post', aprilo dal computer e copia l'indirizzo dalla barra in alto."
        pattern: ["^https://([a-z]+\\.)?(instagram\\.com|facebook\\.com|fb\\.watch|tiktok\\.com)/\\S+$", "Serve un link di Instagram, Facebook o TikTok che inizi con https://"]
      - label: "Data"
        name: "date"
        widget: "datetime"
        required: true
        default: "{{now}}"
        hint: "Si compila da sola. Cambiala solo se aggiungi un post vecchio: i post sono in ordine dal piu' recente."

  - name: "giocatori"
    label: "Rosa"
    folder: "src/content/giocatori"
    create: true
    slug: "{{fields.nome}}"
    identifier_field: "nome"
    format: "frontmatter"
    fields:
      - { label: "Nome", name: "nome", widget: "string", required: true }
      - label: "Ruolo"
        name: "ruolo"
        widget: "select"
        required: false
        hint: "Se non lo sai lascialo vuoto: il giocatore compare in fondo alla rosa, in \"Ruolo da definire\"."
        options: ["Portiere", "Difensore", "Centrocampista", "Attaccante"]
      - { label: "Numero", name: "numero", widget: "number", value_type: "int", required: false }
      - { label: "Foto", name: "foto", widget: "image", required: false, media_folder: "/img/uploads", public_folder: "/img/uploads" }

  - name: "staff"
    label: "Staff e dirigenza"
    folder: "src/content/staff"
    create: true
    slug: "{{fields.nome}}"
    identifier_field: "nome"
    format: "frontmatter"
    fields:
      - { label: "Nome", name: "nome", widget: "string", required: true }
      - { label: "Incarico", name: "incarico", widget: "string", required: true, hint: "Per esempio Presidente, Dirigente, Allenatore." }
      - label: "Sezione"
        name: "sezione"
        widget: "select"
        options: ["Società", "Staff tecnico"]
        default: "Staff tecnico"
        hint: "Società compare nella pagina Club (presidente, dirigenti...), Staff tecnico nella pagina Squadra (allenatori...)."
      - { label: "Foto", name: "foto", widget: "image", required: false, media_folder: "/img/uploads", public_folder: "/img/uploads" }
      - { label: "Ordine", name: "ordine", widget: "number", value_type: "int", required: false, default: 99 }

  - name: "formazione"
    label: "Formazione"
    files:
      - name: "formazione"
        label: "Formazione titolare (home)"
        file: "src/data/formazione.json"
        description: "La formazione della partita in home, da aggiornare ogni settimana. Scegli il portiere e i giocatori di ogni reparto: il modulo (4-4-2, 4-3-3...) si calcola da solo. La formazione resta sempre in home, anche incompleta (in 10, senza portiere): il campo mostra i giocatori inseriti. La panchina e' facoltativa."
        fields:
          - { label: "Titolo", name: "titolo", widget: "string", required: false, hint: "Per esempio: Contro il Sant'Angelo. Se resta vuoto: Formazione titolare." }
          - label: "Modulo"
            name: "modulo"
            widget: "select"
            required: false
            default: "auto"
            options:
              - { label: "Automatico (si ricava dai reparti)", value: "auto" }
              - { label: "4-4-2", value: "4-4-2" }
              - { label: "4-3-3", value: "4-3-3" }
              - { label: "4-2-3-1", value: "4-2-3-1" }
              - { label: "4-3-1-2", value: "4-3-1-2" }
              - { label: "4-5-1", value: "4-5-1" }
              - { label: "3-5-2", value: "3-5-2" }
              - { label: "3-4-3", value: "3-4-3" }
              - { label: "5-3-2", value: "5-3-2" }
              - { label: "5-4-1", value: "5-4-1" }
            hint: "Decide la disposizione in campo: i giocatori vengono presi nell'ordine dei reparti qui sotto (difensori, centrocampisti, trequartisti, attaccanti). Per cambiare modulo basta cambiarlo qui."
          - { label: "Portiere", name: "portiere", widget: "relation", required: false, collection: "giocatori", value_field: "nome", search_fields: ["nome"], display_fields: ["nome"] }
          - label: "Difensori"
            name: "difensori"
            widget: "list"
            required: false
            hint: "Da sinistra a destra, come li vedi guardando la porta avversaria."
            field: { label: "Giocatore", name: "giocatore", widget: "relation", collection: "giocatori", value_field: "nome", search_fields: ["nome"], display_fields: ["nome"] }
          - label: "Centrocampisti"
            name: "centrocampisti"
            widget: "list"
            required: false
            hint: "Da sinistra a destra."
            field: { label: "Giocatore", name: "giocatore", widget: "relation", collection: "giocatori", value_field: "nome", search_fields: ["nome"], display_fields: ["nome"] }
          - label: "Trequartisti"
            name: "trequartisti"
            widget: "list"
            required: false
            hint: "Solo per moduli come il 4-2-3-1. Altrimenti lascia vuoto."
            field: { label: "Giocatore", name: "giocatore", widget: "relation", collection: "giocatori", value_field: "nome", search_fields: ["nome"], display_fields: ["nome"] }
          - label: "Attaccanti"
            name: "attaccanti"
            widget: "list"
            required: false
            hint: "Da sinistra a destra."
            field: { label: "Giocatore", name: "giocatore", widget: "relation", collection: "giocatori", value_field: "nome", search_fields: ["nome"], display_fields: ["nome"] }
          - label: "Panchina"
            name: "panchina"
            widget: "list"
            required: false
            hint: "Le riserve, compaiono sotto il campo. Chi e' gia' titolare viene ignorato."
            field: { label: "Giocatore", name: "giocatore", widget: "relation", collection: "giocatori", value_field: "nome", search_fields: ["nome"], display_fields: ["nome"] }

  - name: "sponsor"
    label: "Sponsor"
    folder: "src/content/sponsor"
    create: true
    slug: "{{fields.nome}}"
    identifier_field: "nome"
    format: "frontmatter"
    fields:
      - { label: "Nome", name: "nome", widget: "string", required: true }
      - label: "Livello"
        name: "livello"
        widget: "select"
        required: false
        default: "partner"
        options: ["main", "tecnico", "partner"]
      - label: "Logo"
        name: "logo"
        widget: "image"
        required: true
        hint: "Se qui sotto metti il sito dello sponsor, il logo diventa cliccabile."
        media_folder: "/img/uploads"
        public_folder: "/img/uploads"
      - label: "Sito web (o pagina Facebook)"
        name: "url"
        widget: "string"
        required: false
        hint: "Facoltativo. Chi clicca il logo finisce qui, in una scheda nuova (esempio: https://www.esempio.it). Lascia vuoto se lo sponsor non ha un sito: il logo resta mostrato, semplicemente non si clicca."
        # Niente "pattern": Sveltia lo controlla anche a campo vuoto e blocca il
        # salvataggio degli sponsor senza link. Lo schema aggiunge https:// se manca.

  # ------------------------------------------------------------------
  # Testi delle pagine: prima erano scritti nel codice e per cambiarli
  # serviva uno sviluppatore. Ora la societa' li modifica da sola.
  # ------------------------------------------------------------------
  - name: "impostazioni"
    label: "Dati della società"
    files:
      - name: "societa"
        label: "Dati e recapiti"
        file: "src/data/societa.json"
        description: "Compaiono nel footer, nella pagina Contatti e nell'informativa privacy. I campi lasciati vuoti non vengono mostrati."
        fields:
          - { label: "Denominazione completa", name: "denominazione", widget: "string", hint: "Come da statuto. Compare nell'informativa privacy." }
          - { label: "Nome breve", name: "denominazioneBreve", widget: "string", hint: "Quello che si legge nel footer." }
          - { label: "Codice fiscale", name: "codiceFiscale", widget: "string" }
          - { label: "Matricola FIGC", name: "matricolaFigc", widget: "string", required: false }
          - { label: "Comune", name: "comune", widget: "string" }
          - { label: "Indirizzo della sede", name: "indirizzo", widget: "string", required: false, hint: "Via e numero civico. Obbligatorio per una privacy policy valida." }
          - { label: "Telefono", name: "telefono", widget: "string", required: false }
          - { label: "Email", name: "email", widget: "string", required: false }
          - { label: "PEC", name: "pec", widget: "string", required: false }
          - { label: "Nome del campo", name: "campoNome", widget: "string" }
          - { label: "Indirizzo del campo", name: "campoIndirizzo", widget: "string" }
          - { label: "Instagram", name: "instagram", widget: "string", required: false }
          - { label: "Facebook", name: "facebook", widget: "string", required: false }
          - { label: "Frase in home", name: "claimHome", widget: "text", hint: "La frase grande sopra la foto del pubblico. Andando a capo si va a capo anche sul sito." }

      - name: "pagina-club"
        label: "Pagina Club"
        file: "src/data/pagina-club.json"
        description: "La storia della società e le tappe della linea del tempo."
        fields:
          - label: "Storia"
            name: "storia"
            widget: "list"
            field: { label: "Paragrafo", name: "paragrafo", widget: "text" }
            hint: "Un elemento per ogni paragrafo."
          - label: "Tappe della linea del tempo"
            name: "tappe"
            widget: "list"
            fields:
              - { label: "Anno", name: "anno", widget: "string", hint: "Anche un periodo, es. 2018-2024." }
              - { label: "Titolo", name: "titolo", widget: "string" }
              - { label: "Testo", name: "testo", widget: "text" }

      - name: "diretta"
        label: "Diretta della partita"
        file: "src/data/diretta.json"
        description: "Attiva il riquadro con il conto alla rovescia in home. Ricordarsi di disattivarlo a partita finita."
        fields:
          - label: "Mostra il riquadro"
            name: "attiva"
            widget: "boolean"
            default: false
            hint: "Spegnere a partita finita, altrimenti il riquadro resta in home."
          - label: "Titolo"
            name: "titolo"
            widget: "string"
            required: false
            hint: "Per esempio: Citta di Galati - Aluntina."
          - label: "Ora del fischio d'inizio"
            name: "inizio"
            widget: "datetime"
            hint: "Il conto alla rovescia parte da solo. All'ora indicata il riquadro passa alla diretta."
          - label: "Link della diretta Facebook"
            name: "urlVideo"
            widget: "string"
            required: false
            hint: "Si incolla quando la diretta e' partita. Senza link, il riquadro invita a seguire la partita sulla pagina Facebook."
