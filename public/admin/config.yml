                  - { label: "Difensore centrale", name: "centrale", widget: "relation", required: false, collection: "giocatori", value_field: "nome", search_fields: ["nome"], display_fields: ["nome"] }
                  - { label: "Difensore centrale destro", name: "centrale_dx", widget: "relation", required: false, collection: "giocatori", value_field: "nome", search_fields: ["nome"], display_fields: ["nome"] }
                  - { label: "Terzino destro", name: "terzino_dx", widget: "relation", required: false, collection: "giocatori", value_field: "nome", search_fields: ["nome"], display_fields: ["nome"] }
                  - { label: "Esterno sinistro", name: "esterno_sx", widget: "relation", required: false, collection: "giocatori", value_field: "nome", search_fields: ["nome"], display_fields: ["nome"] }
                  - { label: "Centrocampista centrale sinistro", name: "centrocampista_sx", widget: "relation", required: false, collection: "giocatori", value_field: "nome", search_fields: ["nome"], display_fields: ["nome"] }
                  - { label: "Centrocampista centrale destro", name: "centrocampista_dx", widget: "relation", required: false, collection: "giocatori", value_field: "nome", search_fields: ["nome"], display_fields: ["nome"] }
                  - { label: "Esterno destro", name: "esterno_dx", widget: "relation", required: false, collection: "giocatori", value_field: "nome", search_fields: ["nome"], display_fields: ["nome"] }
                  - { label: "Punta (centravanti)", name: "punta", widget: "relation", required: false, collection: "giocatori", value_field: "nome", search_fields: ["nome"], display_fields: ["nome"] }
          - label: "Panchina"
            name: "panchina"
            widget: "list"
            required: false
            hint: "Le riserve, compaiono sotto il campo. Chi e' gia' titolare viene ignorato."
            field: { label: "Giocatore", name: "giocatore", widget: "relation", collection: "giocatori", value_field: "nome", search_fields: ["nome"], display_fields: ["nome"] }

  - name: "sponsor"
    label: "Sponsor"
    folder: "src/content/sponsor"
    create: true
    slug: "{{fields.nome}}"
    identifier_field: "nome"
    format: "frontmatter"
    fields:
      - { label: "Nome", name: "nome", widget: "string", required: true }
      - label: "Livello"
        name: "livello"
        widget: "select"
        required: false
        default: "partner"
        options: ["main", "tecnico", "partner"]
      - label: "Logo"
        name: "logo"
        widget: "image"
        required: true
        hint: "Se qui sotto metti il sito dello sponsor, il logo diventa cliccabile."
      - label: "Sito web (o pagina Facebook)"
        name: "url"
        widget: "string"
        required: false
        hint: "Facoltativo. Chi clicca il logo finisce qui, in una scheda nuova (esempio: https://www.esempio.it). Lascia vuoto se lo sponsor non ha un sito: il logo resta mostrato, semplicemente non si clicca."
        # Niente "pattern": Sveltia lo controlla anche a campo vuoto e blocca il
        # salvataggio degli sponsor senza link. Lo schema aggiunge https:// se manca.

  # ------------------------------------------------------------------
  # Testi delle pagine: prima erano scritti nel codice e per cambiarli
  # serviva uno sviluppatore. Ora la societa' li modifica da sola.
  # ------------------------------------------------------------------
  - name: "impostazioni"
    label: "Dati della società"
    files:
      - name: "societa"
        label: "Dati e recapiti"
        file: "src/data/societa.json"
        description: "Compaiono nel footer, nella pagina Contatti e nell'informativa privacy. I campi lasciati vuoti non vengono mostrati."
        fields:
          - { label: "Denominazione completa", name: "denominazione", widget: "string", hint: "Come da statuto. Compare nell'informativa privacy." }
          - { label: "Nome breve", name: "denominazioneBreve", widget: "string", hint: "Quello che si legge nel footer." }
          - { label: "Codice fiscale", name: "codiceFiscale", widget: "string" }
          - { label: "Matricola FIGC", name: "matricolaFigc", widget: "string", required: false }
          - { label: "Comune", name: "comune", widget: "string" }
          - { label: "Indirizzo della sede", name: "indirizzo", widget: "string", required: false, hint: "Via e numero civico. Obbligatorio per una privacy policy valida." }
          - { label: "Telefono", name: "telefono", widget: "string", required: false }
          - { label: "Email", name: "email", widget: "string", required: false }
          - { label: "PEC", name: "pec", widget: "string", required: false }
          - { label: "Nome del campo", name: "campoNome", widget: "string" }
          - { label: "Indirizzo del campo", name: "campoIndirizzo", widget: "string" }
          - { label: "Instagram", name: "instagram", widget: "string", required: false }
          - { label: "Facebook", name: "facebook", widget: "string", required: false }
          - { label: "Frase in home", name: "claimHome", widget: "text", hint: "La frase grande sopra la foto del pubblico. Andando a capo si va a capo anche sul sito." }

      - name: "pagina-club"
        label: "Pagina Club"
        file: "src/data/pagina-club.json"
        description: "La storia della società e le tappe della linea del tempo."
        fields:
          - label: "Storia"
            name: "storia"
            widget: "list"
            field: { label: "Paragrafo", name: "paragrafo", widget: "text" }
            hint: "Un elemento per ogni paragrafo."
          - label: "Tappe della linea del tempo"
            name: "tappe"
            widget: "list"
            fields:
              - { label: "Anno", name: "anno", widget: "string", hint: "Anche un periodo, es. 2018-2024." }
              - { label: "Titolo", name: "titolo", widget: "string" }
              - { label: "Testo", name: "testo", widget: "text" }

      - name: "diretta"
        label: "Diretta della partita"
        file: "src/data/diretta.json"
        description: "Il riquadro della partita in home. Con l'ora del fischio: conto alla rovescia, diretta per 3 ore, poi \"Rivedi la partita\" col video, e sparisce da solo 7 giorni dopo. Senza ora: il video compare subito come \"Guarda la partita\" e resta finche' non spegni l'interruttore."
        fields:
          - label: "Diretta e replica visibili in home"
            name: "attiva"
            widget: "boolean"
            default: false
            hint: "Acceso: il riquadro e' in home. SPENTO e salvato: il video sparisce dal sito in 1-2 minuti, quando vuoi (anche a partita appena finita). Con l'ora del fischio sparisce comunque da solo 7 giorni dopo; senza ora resta finche' non lo spegni."
          - label: "Titolo"
            name: "titolo"
            widget: "string"
            required: false
            hint: "Per esempio: Citta di Galati - Aluntina."
          - label: "Ora del fischio d'inizio"
            name: "inizio"
            widget: "datetime"
            # salvata con il fuso ("...T15:30:00+02:00"): letta giusta anche all'estero
            format: "YYYY-MM-DDTHH:mm:ssZ"
            required: false
            hint: "Facoltativa. Se la metti: conto alla rovescia in home, all'ora indicata la diretta (per 3 ore), poi la replica, e dopo 7 giorni sparisce da sola. Se la lasci vuota: niente conto alla rovescia, il video compare appena salvi (1-2 minuti) con la scritta \"Guarda la partita\" e resta finche' non spegni l'interruttore qui sopra."
          - label: "Scadenza (facoltativa)"
            name: "scadenza"
            widget: "datetime"
            format: "YYYY-MM-DDTHH:mm:ssZ"
            required: false
            hint: "Facoltativa. Da quest'ora il riquadro sparisce dal sito da solo, anche se non sono passati i 7 giorni dal fischio d'inizio. Vuota: vale la regola normale (7 giorni dopo il fischio d'inizio, o finche' non spegni l'interruttore)."
          - label: "Link della diretta (YouTube, Twitch o Facebook)"
            name: "urlVideo"
            widget: "string"
            required: false
            hint: "YouTube: apri la diretta, Condividi, Copia link (resta valido anche come replica). Twitch: PRIMA della prima diretta, dal sito twitch.tv (non dall'app), attiva Impostazioni > Streaming > Archivia le trasmissioni passate, altrimenti la partita non viene salvata. Poi incolla il link del canale, per esempio https://www.twitch.tv/nomecanale; a partita finita, per rivederla qui, sostituiscilo con il link del video salvato (twitch.tv/videos/...), altrimenti sotto il riquadro c'e' il collegamento ai video del canale. Funziona anche un link di Facebook."
          - label: "Tabellino (risultato e tempi)"
            name: "tabellino"
            widget: "object"
            collapsed: false
            hint: "La fascia col risultato sopra il video, come in Serie A. Compare quando salvi l'Inizio del 1° tempo. Il sito si aggiorna in circa 1-2 minuti; il minuto di gioco scorre da solo. PRIMA DI OGNI PARTITA: scegli l'avversario, controlla In casa e il nome corto avversario (restano quelli della partita prima), gol a 0 e i quattro orari svuotati con Clear."
            fields:
              - label: "Avversario"
                name: "avversario"
                widget: "select"
                required: false
                hint: "Nome e scudetto arrivano da soli. Se non e' in elenco (coppa, amichevole) scegli l'ultima voce e compila 'Squadra fuori elenco'."
                options:
                  - { label: "Città Di Sant'Angelo", value: "1207601" }
                  - { label: "Club Sportivo Oliveri", value: "1170703" }
                  - { label: "Ludica Lipari", value: "1043806" }
                  - { label: "Mazzarrà Calcio", value: "920357" }
                  - { label: "Melas", value: "933619" }
                  - { label: "OR.SA.", value: "740525" }
                  - { label: "Patti Calcio", value: "1282009" }
                  - { label: "Polisportiva Torrenovese 1971", value: "1170704" }
                  - { label: "Rocca 2023", value: "1207603" }
                  - { label: "San Benedetto Calcio San Fratello", value: "1207604" }
                  - { label: "San Pier Niceto", value: "1209760" }
                  - { label: "Tortorici", value: "1026407" }
                  - { label: "Altra squadra (compila 'Squadra fuori elenco')", value: "altra" }
              - label: "Giochiamo in casa"
                name: "inCasa"
                widget: "boolean"
                default: true
                hint: "Acceso: noi a sinistra, come la squadra di casa. Spento: in trasferta, noi a destra."
              - label: "Nome corto nostro (facoltativo)"
                name: "nomeCortoNostro"
                widget: "string"
                required: false
                hint: "Vuoto: il nome di Tuttocampo. Scrivilo se lo vuoi piu' breve nel tabellino."
              - label: "Nome corto avversario (facoltativo)"
                name: "nomeCortoAvversario"
                widget: "string"
                required: false
                hint: "Vuoto: il nome di Tuttocampo. Resta salvato: alla partita dopo svuotalo o cambialo, altrimenti finisce accanto allo scudetto della nuova squadra."
              - label: "Squadra fuori elenco (coppa, amichevoli)"
                name: "fuoriElenco"
                widget: "object"
                collapsed: true
                fields:
                  - { label: "Nome", name: "nome", widget: "string", required: false }
                  - { label: "Scudetto", name: "scudetto", widget: "image", required: false, hint: "Carica lo stemma dal telefono. Si usa solo se in Avversario hai scelto 'Altra squadra'." }
              - label: "Gol nostri"
                name: "golNostri"
                widget: "number"
                value_type: "int"
                min: 0
                max: 99
                default: 0
              - label: "Gol avversari"
                name: "golAvversari"
                widget: "number"
                value_type: "int"
                min: 0
                max: 99
                default: 0
              - label: "Inizio 1° tempo"
                name: "inizio1"
                widget: "datetime"
                format: "YYYY-MM-DDTHH:mm:ssZ"
                required: false
                hint: "Al fischio d'inizio tocca Now, poi Save. Fa comparire il tabellino."
              - label: "Fine 1° tempo"
                name: "fine1"
                widget: "datetime"
                format: "YYYY-MM-DDTHH:mm:ssZ"
                required: false
                hint: "Now, poi Save: mostra Intervallo. Il recupero (45+2') si conta da solo fino a qui."
              - label: "Inizio 2° tempo"
                name: "inizio2"
                widget: "datetime"
                format: "YYYY-MM-DDTHH:mm:ssZ"
                required: false
                hint: "Now, poi Save: il minuto riparte da 46."
              - label: "Fine 2° tempo"
                name: "fine2"
                widget: "datetime"
                format: "YYYY-MM-DDTHH:mm:ssZ"
                required: false
                hint: "Now, poi Save: mostra Finale, che resta anche sotto la replica. Se te lo dimentichi compare da solo dopo 75 minuti dall'inizio del 2° tempo."
