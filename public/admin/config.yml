                  - { label: "Difensore centrale", name: "centrale", widget: "relation", required: false, collection: "giocatori", value_field: "nome", search_fields: ["nome"], display_fields: ["nome"] }
                  - { label: "Difensore centrale destro", name: "centrale_dx", widget: "relation", required: false, collection: "giocatori", value_field: "nome", search_fields: ["nome"], display_fields: ["nome"] }
                  - { label: "Terzino destro", name: "terzino_dx", widget: "relation", required: false, collection: "giocatori", value_field: "nome", search_fields: ["nome"], display_fields: ["nome"] }
                  - { label: "Esterno sinistro", name: "esterno_sx", widget: "relation", required: false, collection: "giocatori", value_field: "nome", search_fields: ["nome"], display_fields: ["nome"] }
                  - { label: "Centrocampista centrale sinistro", name: "centrocampista_sx", widget: "relation", required: false, collection: "giocatori", value_field: "nome", search_fields: ["nome"], display_fields: ["nome"] }
                  - { label: "Centrocampista centrale destro", name: "centrocampista_dx", widget: "relation", required: false, collection: "giocatori", value_field: "nome", search_fields: ["nome"], display_fields: ["nome"] }
                  - { label: "Esterno destro", name: "esterno_dx", widget: "relation", required: false, collection: "giocatori", value_field: "nome", search_fields: ["nome"], display_fields: ["nome"] }
                  - { label: "Punta (centravanti)", name: "punta", widget: "relation", required: false, collection: "giocatori", value_field: "nome", search_fields: ["nome"], display_fields: ["nome"] }
          - label: "Panchina"
            name: "panchina"
            widget: "list"
            required: false
            hint: "Le riserve, compaiono sotto il campo. Chi e' gia' titolare viene ignorato."
            field: { label: "Giocatore", name: "giocatore", widget: "relation", collection: "giocatori", value_field: "nome", search_fields: ["nome"], display_fields: ["nome"] }

  - name: "sponsor"
    label: "Sponsor"
    folder: "src/content/sponsor"
    create: true
    slug: "{{fields.nome}}"
    identifier_field: "nome"
    format: "frontmatter"
    fields:
      - { label: "Nome", name: "nome", widget: "string", required: true }
      - label: "Livello"
        name: "livello"
        widget: "select"
        required: false
        default: "partner"
        options: ["main", "tecnico", "partner"]
      - label: "Logo"
        name: "logo"
        widget: "image"
        required: true
        hint: "Se qui sotto metti il sito dello sponsor, il logo diventa cliccabile."
      - label: "Sito web (o pagina Facebook)"
        name: "url"
        widget: "string"
        required: false
        hint: "Facoltativo. Chi clicca il logo finisce qui, in una scheda nuova (esempio: https://www.esempio.it). Lascia vuoto se lo sponsor non ha un sito: il logo resta mostrato, semplicemente non si clicca."
        # Niente "pattern": Sveltia lo controlla anche a campo vuoto e blocca il
        # salvataggio degli sponsor senza link. Lo schema aggiunge https:// se manca.

  # ------------------------------------------------------------------
  # Testi delle pagine: prima erano scritti nel codice e per cambiarli
  # serviva uno sviluppatore. Ora la societa' li modifica da sola.
  # ------------------------------------------------------------------
  - name: "impostazioni"
    label: "Dati della società"
    files:
      - name: "societa"
        label: "Dati e recapiti"
        file: "src/data/societa.json"
        description: "Compaiono nel footer, nella pagina Contatti e nell'informativa privacy. I campi lasciati vuoti non vengono mostrati."
        fields:
          - { label: "Denominazione completa", name: "denominazione", widget: "string", hint: "Come da statuto. Compare nell'informativa privacy." }
          - { label: "Nome breve", name: "denominazioneBreve", widget: "string", hint: "Quello che si legge nel footer." }
          - { label: "Codice fiscale", name: "codiceFiscale", widget: "string" }
          - { label: "Matricola FIGC", name: "matricolaFigc", widget: "string", required: false }
          - { label: "Comune", name: "comune", widget: "string" }
          - { label: "Indirizzo della sede", name: "indirizzo", widget: "string", required: false, hint: "Via e numero civico. Obbligatorio per una privacy policy valida." }
          - { label: "Telefono", name: "telefono", widget: "string", required: false }
          - { label: "Email", name: "email", widget: "string", required: false }
          - { label: "PEC", name: "pec", widget: "string", required: false }
          - { label: "Nome del campo", name: "campoNome", widget: "string" }
          - { label: "Indirizzo del campo", name: "campoIndirizzo", widget: "string" }
          - { label: "Instagram", name: "instagram", widget: "string", required: false }
          - { label: "Facebook", name: "facebook", widget: "string", required: false }
          - { label: "Frase in home", name: "claimHome", widget: "text", hint: "La frase grande sopra la foto del pubblico. Andando a capo si va a capo anche sul sito." }

      - name: "pagina-club"
        label: "Pagina Club"
        file: "src/data/pagina-club.json"
        description: "La storia della società e le tappe della linea del tempo."
        fields:
          - label: "Storia"
            name: "storia"
            widget: "list"
            field: { label: "Paragrafo", name: "paragrafo", widget: "text" }
            hint: "Un elemento per ogni paragrafo."
          - label: "Tappe della linea del tempo"
            name: "tappe"
            widget: "list"
            fields:
              - { label: "Anno", name: "anno", widget: "string", hint: "Anche un periodo, es. 2018-2024." }
              - { label: "Titolo", name: "titolo", widget: "string" }
              - { label: "Testo", name: "testo", widget: "text" }

      - name: "diretta"
        label: "Diretta della partita"
        file: "src/data/diretta.json"
        description: "Il riquadro in home: conto alla rovescia prima della partita, la diretta per 3 ore dal fischio d'inizio, poi \"Rivedi la partita\" col video. Sparisce da solo 7 giorni dopo il fischio d'inizio."
        fields:
          - label: "Diretta e replica visibili in home"
            name: "attiva"
            widget: "boolean"
            default: false
            hint: "Acceso: conto alla rovescia, diretta e poi replica in home. SPENTO e salvato: il video sparisce dal sito in 4-5 minuti, quando vuoi (anche a partita appena finita). Se lo lasci acceso sparisce comunque da solo 7 giorni dopo il fischio d'inizio."
          - label: "Titolo"
            name: "titolo"
            widget: "string"
            required: false
            hint: "Per esempio: Citta di Galati - Aluntina."
          - label: "Ora del fischio d'inizio"
            name: "inizio"
            widget: "datetime"
            # salvata con il fuso ("...T15:30:00+02:00"): letta giusta anche all'estero
            format: "YYYY-MM-DDTHH:mm:ssZ"
            hint: "Il conto alla rovescia parte da solo. All'ora indicata il riquadro passa alla diretta (per 3 ore), poi alla replica per una settimana."
          - label: "Link della diretta (YouTube, Twitch o Facebook)"
            name: "urlVideo"
            widget: "string"
            required: false
            hint: "YouTube: apri la diretta, Condividi, Copia link (resta valido anche come replica). Twitch: PRIMA della prima diretta, dal sito twitch.tv (non dall'app), attiva Impostazioni > Streaming > Archivia le trasmissioni passate, altrimenti la partita non viene salvata. Poi incolla il link del canale, per esempio https://www.twitch.tv/nomecanale; a partita finita, per rivederla qui, sostituiscilo con il link del video salvato (twitch.tv/videos/...), altrimenti il riquadro rimanda ai video del canale. Funziona anche un link di Facebook."
