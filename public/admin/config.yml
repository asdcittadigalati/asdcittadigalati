# Accesso con account GitHub. Netlify Identity e Git Gateway sono deprecati
# (Netlify non ne corregge piu' i bug e ne sconsiglia l'uso sui siti nuovi),
# quindi il pannello parla direttamente con GitHub: chi gestisce i contenuti
# entra col proprio account GitHub e deve essere invitato come collaboratore
# del repository.
backend:
  name: github
  # Repo sull'account GitHub della squadra (dal 01/10/2026).
  repo: asdcittadigalati/asdcittadigalati
  branch: main
  # L'accesso passa da /auth e /callback sul sito stesso (worker/index.mjs su
  # Cloudflare): servono perche' lo scambio finale con GitHub richiede un segreto
  # che non puo' stare in una pagina web. Nessun servizio esterno in piu'.
  # Il callback dell'applicazione OAuth su GitHub deve essere lo stesso dominio.
  base_url: https://asdcittadigalati.it

# Backend locale per le prove in sviluppo: decommentare e lanciare
# `npx @sveltia/cms-proxy-server` per scrivere sul disco senza passare da
# GitHub. Deve restare commentato in produzione.
# local_backend: true

# Tutte le immagini caricate dal pannello finiscono qui. Niente media_folder
# sui singoli campi: "/img/uploads" li faceva salvare in img/uploads alla radice
# del progetto, fuori da public/, e sul sito le foto non comparivano.
media_folder: "public/img/uploads"
public_folder: "/img/uploads"

locale: "it"

collections:
  - name: "social"
    label: "Social"
    label_singular: "Post"
    description: "Incolla il link di un post pubblico di Instagram, Facebook o TikTok: sul sito compare da solo, in home e nella pagina Social."
    folder: "src/content/social"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{hour}}{{minute}}{{second}}"
    identifier_field: "link"
    summary: "{{date | date('DD/MM/YYYY')}} · {{link}}"
    sortable_fields: ["date"]
    format: "frontmatter"
    fields:
      - label: "Link al post"
        name: "link"
        widget: "string"
        required: true
        hint: "Dal social: tocca Condividi (o i tre puntini) e poi Copia link, e incollalo qui. Il post deve essere pubblico: i profili privati e i post dentro i gruppi Facebook non si vedono. Facebook dal telefono: se sul sito il post compare solo come 'Apri il post', aprilo dal computer e copia l'indirizzo dalla barra in alto."
        pattern: ["^https://([a-z]+\\.)?(instagram\\.com|facebook\\.com|fb\\.watch|tiktok\\.com)/\\S+$", "Serve un link di Instagram, Facebook o TikTok che inizi con https://"]
      - label: "Data"
        name: "date"
        widget: "datetime"
        required: true
        default: "{{now}}"
        hint: "Si compila da sola. Cambiala solo se aggiungi un post vecchio: i post sono in ordine dal piu' recente."

  - name: "giocatori"
    label: "Rosa"
    folder: "src/content/giocatori"
    create: true
    slug: "{{fields.nome}}"
    identifier_field: "nome"
    format: "frontmatter"
    fields:
      - { label: "Nome", name: "nome", widget: "string", required: true }
      - label: "Ruolo"
        name: "ruolo"
        widget: "select"
        required: false
        hint: "Se non lo sai lascialo vuoto: il giocatore compare in fondo alla rosa, in \"Ruolo da definire\"."
        options: ["Portiere", "Difensore", "Centrocampista", "Attaccante"]
      - { label: "Numero", name: "numero", widget: "number", value_type: "int", required: false }
      - { label: "Foto", name: "foto", widget: "image", required: false }

  - name: "staff"
    label: "Staff e dirigenza"
    folder: "src/content/staff"
    create: true
    slug: "{{fields.nome}}"
    identifier_field: "nome"
    format: "frontmatter"
    fields:
      - { label: "Nome", name: "nome", widget: "string", required: true }
      - { label: "Incarico", name: "incarico", widget: "string", required: true, hint: "Per esempio Presidente, Dirigente, Allenatore." }
      - label: "Sezione"
        name: "sezione"
        widget: "select"
        options: ["Società", "Staff tecnico"]
        default: "Staff tecnico"
        hint: "Società compare nella pagina Club (presidente, dirigenti...), Staff tecnico nella pagina Squadra (allenatori...)."
      - { label: "Foto", name: "foto", widget: "image", required: false }
      - { label: "Ordine", name: "ordine", widget: "number", value_type: "int", required: false, default: 99 }

  - name: "formazione"
    label: "Formazione"
    files:
      - name: "formazione"
        label: "Formazione titolare (home)"
        file: "src/data/formazione.json"
        description: "La formazione della partita in home, da aggiornare ogni settimana. Scegli il modulo (4-4-2, 4-3-3...) e metti un giocatore in ogni ruolo: sinistra e destra sono quelle della squadra. La formazione resta sempre in home, anche incompleta (in 10, senza portiere): il campo mostra i giocatori inseriti. La panchina e' facoltativa."
        fields:
          - { label: "Titolo", name: "titolo", widget: "string", required: false, hint: "Per esempio: Contro il Sant'Angelo. Se resta vuoto: Formazione titolare." }
          - label: "Modulo e titolari"
            name: "schieramento"
            widget: "object"
            required: false
            typeKey: "modulo"
            hint: "Scegli il modulo: compaiono le caselle dei ruoli, dalla difesa all'attacco. In ogni casella scegli il giocatore. Se manca qualcuno lascia vuota la sua casella: il campo mostra chi c'e'. Per cambiare modulo clicca la X accanto al modulo e scegline un altro (le caselle ripartono vuote)."
            types:
              - name: "4-4-2"
                label: "4-4-2"
                widget: "object"
